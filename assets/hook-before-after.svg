<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" width="1160" height="380" role="img" aria-label="Before and after the tool-output filter hook: a 10,000 line test log becomes about 100 lines of failures">
  <style>
    .t   { font-family: system-ui,-apple-system,Segoe UI,sans-serif; }
    .m   { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
    .ink { fill: #e8ebef; }
    .dim { fill: #99a2ae; }
  </style>
  <rect width="1160" height="380" rx="16" fill="#12161d"/>
  <text class="t ink" x="40" y="52" font-size="26" font-weight="700">The filter hook runs outside the model</text>
  <text class="t dim" x="40" y="82" font-size="17">Whatever it throws away is never paid for — the model never sees it.</text>

  <!-- before -->
  <g transform="translate(40,120)">
    <text class="t dim" x="0" y="0" font-size="16">without the hook</text>
    <rect x="0" y="16" width="470" height="150" rx="8" fill="#1b2129" stroke="#2b333e"/>
    <g class="m" font-size="11" fill="#6d7683">
      <text x="16" y="40">PASS  src/a.test.ts</text>
      <text x="16" y="58">PASS  src/b.test.ts</text>
      <text x="16" y="76">PASS  src/c.test.ts   … 9,996 more lines …</text>
      <text x="16" y="94" fill="#fa5252">FAIL  src/auth.test.ts › rejects expired token</text>
      <text x="16" y="112">PASS  src/d.test.ts</text>
      <text x="16" y="130">PASS  src/e.test.ts</text>
      <text x="16" y="148">PASS  src/f.test.ts</text>
    </g>
    <rect x="0" y="184" width="470" height="30" rx="6" fill="#fa5252"/>
    <text class="m" x="16" y="205" font-size="15" fill="#ffffff">~38,000 tokens into context</text>
  </g>

  <!-- arrow -->
  <g transform="translate(536,215)">
    <path d="M0 0 L64 0" stroke="#f6c453" stroke-width="3" marker-end="url(#h)"/>
    <text class="m" x="32" y="-14" font-size="13" fill="#f6c453" text-anchor="middle">hook</text>
  </g>
  <defs><marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#f6c453"/></marker></defs>

  <!-- after -->
  <g transform="translate(648,120)">
    <text class="t dim" x="0" y="0" font-size="16">with the hook</text>
    <rect x="0" y="16" width="470" height="150" rx="8" fill="#1b2129" stroke="#2b333e"/>
    <g class="m" font-size="11">
      <text x="16" y="40" fill="#fa5252">FAIL  src/auth.test.ts › rejects expired token</text>
      <text x="16" y="58" fill="#c3cbd6">  expected 401, received 200</text>
      <text x="16" y="76" fill="#c3cbd6">  at src/auth.ts:42</text>
      <text x="16" y="112" fill="#f6c453">[tokenmiser] exit=1, output filtered</text>
    </g>
    <rect x="0" y="184" width="470" height="30" rx="6" fill="#12b886"/>
    <text class="m" x="16" y="205" font-size="15" fill="#03301f">~120 tokens into context</text>
  </g>

  <text class="t dim" x="40" y="352" font-size="15">The exit status survives the filter, so a hidden failure can never look like a pass.</text>
</svg>
